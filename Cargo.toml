[package]
name = "chainlight"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A Bitcoin Core terminal dashboard with native Omarchy integration"
license = "MIT"
repository = "https://github.com/gnulnx/Chainlight"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
url = "2"
base64 = "0.22"
nix = { version = "0.30", features = ["fs"] }
toml = "0.9"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
