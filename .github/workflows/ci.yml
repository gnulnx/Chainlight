name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Integration script syntax
        run: |
          bash -n integrations/omarchy/chainlight-omarchy integrations/arch/PKGBUILD
          python3 -m py_compile integrations/install-user.py integrations/arch/prepare-source.py
